name: CovertScope CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

jobs:
  test-and-smoke:
    name: Test and Docker smoke test
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: covertscope
      POSTGRES_PASSWORD: ci-only-postgres-password
      POSTGRES_DB: covertscope_test
      COVERTSCOPE_API_KEY: ci-only-api-key-not-for-deployment
      COVERTSCOPE_INGEST_SECRET: ci-only-ingest-secret-not-for-deployment
      CORS_ORIGINS: http://localhost:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and build
        working-directory: frontend
        run: |
          npm ci
          npm audit
          npm test
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Audit backend dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build and start Docker services
        run: docker compose up --build -d --wait --wait-timeout 90

      - name: Run PostgreSQL blocklist integration test
        run: |
          docker compose run --rm --no-deps \
            -e COVERTSCOPE_TEST_DATABASE_URL="postgresql+asyncpg://covertscope:${POSTGRES_PASSWORD}@db:5432/covertscope_test" \
            -v "${GITHUB_WORKSPACE}/backend/tests:/app/tests:ro" \
            backend python -m unittest discover -s /app/tests -p "test_blocklist_postgres.py" -v

      - name: Smoke-test backend API and frontend
        run: |
          curl --fail --silent --show-error \
            --retry 15 --retry-connrefused --retry-all-errors --retry-delay 2 --retry-max-time 45 \
            http://localhost:8000/api/health \
            | python -c 'import json, sys; health = json.load(sys.stdin); assert health["status"] == "ok", health'
          curl --fail --silent --show-error \
            -H "X-API-Key: $COVERTSCOPE_API_KEY" \
            http://localhost:8000/api/stats \
            | python -c 'import json, sys; stats = json.load(sys.stdin); assert "total_flows" in stats, stats'
          curl --fail --silent --show-error http://localhost:3000/ \
            | grep -q "CovertScope"

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Docker services
        if: always()
        run: docker compose down --volumes --remove-orphans
